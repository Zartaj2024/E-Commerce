services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: suti-thread:latest
    container_name: suti-thread-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - suti-network
    # Uncomment for production with secrets management:
    # secrets:
    #   - supabase_url
    #   - supabase_key
    #   - stripe_key
    #   - resend_key

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: suti-thread:dev
    container_name: suti-thread-dev
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
        - action: rebuild
          path: package.json
    networks:
      - suti-network

networks:
  suti-network:
    driver: bridge

# For production, use Docker secrets instead of env files:
# secrets:
#   supabase_url:
#     environment: NEXT_PUBLIC_SUPABASE_URL
#   supabase_key:
#     environment: NEXT_PUBLIC_SUPABASE_ANON_KEY
#   stripe_key:
#     environment: STRIPE_SECRET_KEY
#   resend_key:
#     environment: RESEND_API_KEY
